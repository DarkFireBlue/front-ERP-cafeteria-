<div class="modulo-contenedor">
  <div class="cabecera-modulo">
    <div class="textos-cabecera">
      <h2>Gestión de Inventario</h2>
    </div>
    <button class="btn-primario-cafe" (click)="agregarProducto()">+ Agregar producto</button>
  </div>

  <div class="seccion-tabla">
    <div class="contenedor-tabla">
      <table class="tabla-datos">
        <thead>
          <tr>
            <th>Producto</th>
            <th>Descripción</th>
            <th>Cantidad</th>
            <th>Precio unitario</th>
          </tr>
        </thead>
        <tbody>
          @for (item of productos; track item.id) {
            <tr>
              <td>{{ item.nombre || item.producto }}</td>
              <td>{{ item.descripcion }}</td>
              <td>{{ item.stock ?? item.cantidad }}</td>
              <td>${{ item.precio || item.precioUnitario }}</td>
            </tr>
          } @empty {
            <tr>
              <td colspan="4" style="text-align: center;">Cargando datos o tabla vacía...</td>
            </tr>
          }
        </tbody>
      </table>
    </div>
  </div>
</div>
