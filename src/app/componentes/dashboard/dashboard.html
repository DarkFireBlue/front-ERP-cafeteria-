<div class="dashboard-contenedor">
  <div class="cabecera-dashboard">
    <h2>Panel principal</h2>
  </div>

  <div class="grid-tarjetas">
    @for (tarjeta of tarjetas; track tarjeta.id) {
      <div class="tarjeta">
        <h3>{{ tarjeta.titulo }}</h3>
        <p class="subtitulo">{{ tarjeta.subtitulo }}</p>

        <div class="metricas">
          <div class="dato">
            <h4>{{ tarjeta.metrica1.valor }}</h4>
            <span>{{ tarjeta.metrica1.etiqueta }}</span>
          </div>

          <div class="dato {{ tarjeta.metrica2.esAlerta ? 'alerta' : '' }}">
            <h4>{{ tarjeta.metrica2.valor }}</h4>
            <span>{{ tarjeta.metrica2.etiqueta }}</span>
          </div>
        </div>
      </div>
    }
  </div>
</div>
